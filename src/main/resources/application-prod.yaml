# ==================== 生产环境 ====================
spring:
  thymeleaf:
    # 生产开启模板缓存
    cache: true
  datasource:
    # 生产环境使用原生 MySQL 驱动，去掉 p6spy（避免每条 SQL 都经过代理层）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:smart_admin_v3}?autoReconnect=true&useServerPreparedStmts=false&rewriteBatchedStatements=true&characterEncoding=UTF-8&useSSL=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    # 敏感信息走环境变量，禁止明文写进仓库
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat,wall
      # 生产环境关闭 Druid 监控页
      stat-view-servlet:
        enabled: false

logging:
  level:
    com.dadaz: info

# 生产环境关闭接口文档与 knife4j，避免暴露接口结构
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
