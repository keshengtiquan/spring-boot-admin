# ==================== 开发环境 ====================
spring:
  thymeleaf:
    # 开发期关闭模板缓存，改完页面刷新即生效
    cache: false
  datasource:
    # p6spy 代理驱动，用于打印真实执行的 SQL
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://127.0.0.1:3306/dd-vue?autoReconnect=true&useServerPreparedStmts=false&rewriteBatchedStatements=true&characterEncoding=UTF-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat
      # 开发环境打开 Druid 监控页 /druid
      stat-view-servlet:
        enabled: true
        login-username: druid
        login-password: 1024
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      # password:
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 5
          min-idle: 1
          max-idle: 3
          max-wait: 30000ms

mybatis-plus:
  # 指定mapper的存放路径
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 自动驼峰命名规则（camel case）映射
    map-underscore-to-camel-case: true

logging:
  level:
    com.dadaz: debug

# 开发环境：输出 sa-token 操作日志与启动 banner，便于排查鉴权问题
sa-token:
  is-log: true
  is-print: true

# 开发环境保留接口文档
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true
